name: Build dist

# 前端只交付 dist/。CI 构建一次，然后以两种形式发布：
#
#   1. GitHub Release 附件 `dist.tar.gz`（+ sha256）
#        curl -L .../releases/latest/download/dist.tar.gz | tar xz
#   2. GHCR 纯文件镜像 `ghcr.io/<owner>/xcollector-web`
#        docker pull 之后用 docker cp 取出来
#
# 第 2 种镜像用 FROM scratch，里面**没有任何运行时、没有服务、没有 nginx** ——
# 它只是一个能被 pull、能被 cp 的文件袋。不想在部署机上装 Node 的话，
# 这两种方式都能拿到最终产物。
#
# 两种形式的区别只在取用方式：Release 适合 curl，GHCR 适合已经在用 Docker 的人。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 / 更新 Release
      packages: write # 推 GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 装依赖
        run: npm ci

      # 自检放在构建**之前**：它抓的是"增量刷新把列表换成增量那几条"这类
      # 眼睛看不出来的错（要等一轮自动刷新才显形）。跑不动就不该出包。
      - name: 自检（store：增量合并 / 多选 / 批量操作）
        run: npm test

      - name: 构建
        run: |
          npm run build
          test -f dist/index.html

      - name: 打包 dist.tar.gz
        run: |
          # 打成带顶层 dist/ 的形式，解压后就是 <目标目录>/dist/
          tar -czf dist.tar.gz dist
          sha256sum dist.tar.gz > dist.tar.gz.sha256
          ls -lh dist.tar.gz
          cat dist.tar.gz.sha256

      # GHCR 的镜像路径必须**全小写**，而 GitHub 用户名可能含大写字母
      # （例如 Xqy1y4ever）。直接拼 ${{ github.repository }} 会报
      # "repository name must be lowercase"，所以这里转一次。
      - name: 计算小写镜像名
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送纯文件镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 发布 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="${TAG}"
            PRE=""
          else
            # 推 main 时滚动更新一个预发布版本，方便"永远拿最新"
            TAG="latest"
            TITLE="最新构建（main）"
            PRE="--prerelease"
          fi

          NOTES="commit ${GITHUB_SHA}"$'\n\n'"$(date -u +%FT%TZ)"

          # 不存在就建，存在就只更新说明 —— 不重复建，也不覆盖正式 tag
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TITLE" --notes "$NOTES" $PRE

          gh release upload "$TAG" dist.tar.gz dist.tar.gz.sha256 --clobber
          gh release edit "$TAG" --notes "$NOTES"

          echo "Release 已更新：$TAG"
